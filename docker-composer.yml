networks:
  app-network:
    driver: bridge

services:
  postgres:
    build:
      context: ./Database
      dockerfile: dockerfile
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - Database/.env.production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./Backend
      dockerfile: dockerfile
    ports:
      - "8181:8181"
    volumes:
      - ./Backend/assets:/app/assets
    env_file:
      - ./Backend/.env.production
    command: bun start
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8181/api/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - postgres
    networks:
      - app-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: dockerfile
    ports:
      - "5151:80"
    environment:
      - NODE_ENV=production
    env_file:
      - Frontend/.env.production
    depends_on:
      - backend
    networks:
      - app-network
    
volumes:
  postgres_data:
